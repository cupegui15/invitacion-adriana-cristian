<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7f0" />
    <meta name="description" content="Toca el sello para abrir la invitación de Adriana y Cristian." />
    <title>Adriana &amp; Cristian · Toca el sello</title>
    <link rel="preload" as="image" href="assets/images/portada-sobre.jpg" />
    <link rel="stylesheet" href="portada.css?v=2vueltas" />
    <script src="portada.js?v=2vueltas" defer></script>
  </head>
  <body>
    <a class="skip-link" href="invitacion.html">Saltar la animación y abrir la invitación</a>
    <main class="entry-page">
      <div class="cover" id="portada">
        <img
          class="cover-art"
          src="assets/images/portada-sobre.jpg"
          alt="Sobre verde de la boda de Adriana y Cristian con una fotografía y un sello dorado que dice: Toca el sello para abrir tu invitación."
          width="990"
          height="1400"
          fetchpriority="high"
          draggable="false"
        />
        <button class="seal-button" id="open-invitation" type="button" aria-label="Tocar el sello para abrir la invitación">
          <span class="seal-aura" aria-hidden="true"></span>
          <span class="seal-light" aria-hidden="true"></span>
          <span class="seal-flash" aria-hidden="true"></span>
        </button>
        <p class="screen-reader-only" id="opening-status" role="status" aria-live="polite"></p>
      </div>
    </main>
  </body>
</html>
