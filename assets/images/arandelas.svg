<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 1400" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <pattern id="malla" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M-19 19 19-19M0 38 38 0M19 57 57 19M-19 19 19 57M0 0 38 38M19-19 57 19" fill="none" stroke="#716f65" stroke-width="4" stroke-opacity=".24"/>
      <path d="M-19 19 19-19M0 38 38 0M19 57 57 19M-19 19 19 57M0 0 38 38M19-19 57 19" fill="none" stroke="#fffefa" stroke-width="2.5" stroke-opacity=".92"/>
    </pattern>
    <filter id="sombra" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#55564f" flood-opacity=".25"/>
    </filter>
    <mask id="marco" maskUnits="userSpaceOnUse" x="0" y="0" width="990" height="1400">
      <rect width="990" height="1400" fill="#000"/>
      <rect x="145" y="10" width="700" height="900" rx="48" fill="#fff"/>
      <rect x="195" y="145" width="600" height="850" rx="24" fill="#000"/>
      <path d="M158 560 660 506 735 843 235 910Z" fill="#000"/>
    </mask>
    <path id="exterior" d="M162 880V88Q162 18 232 18H758Q828 18 828 88V880"/>
    <path id="interior" d="M195 850V173Q195 145 223 145H767Q795 145 795 173V850"/>
  </defs>
  <g mask="url(#marco)" filter="url(#sombra)">
    <rect x="145" y="10" width="700" height="900" rx="48" fill="url(#malla)"/>
    <!-- Pequeños festones redondos que forman el borde de encaje. -->
    <use href="#exterior" fill="none" stroke="#c9c6ba" stroke-width="20" stroke-dasharray="0 42" stroke-linecap="round"/>
    <use href="#exterior" fill="none" stroke="#fffefa" stroke-width="14" stroke-dasharray="0 42" stroke-linecap="round"/>
    <use href="#interior" fill="none" stroke="#c9c6ba" stroke-width="9" stroke-dasharray="0 27" stroke-linecap="round"/>
    <use href="#interior" fill="none" stroke="#fffefa" stroke-width="5" stroke-dasharray="0 27" stroke-linecap="round"/>
  </g>
</svg>
